name: Build American Life English APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix JVM compatibility
        run: |
          GRADLE_FILE=$(find . -type f -path "*/app/build.gradle.kts" -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle file not found!"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found: $GRADLE_FILE"

          python3 - "$GRADLE_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          old = '    buildFeatures { compose = true }'

          new = '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }'''

          if old in s:
              s = s.replace(old, new, 1)
          elif 'jvmTarget = "17"' not in s:
              raise SystemExit("Expected Gradle configuration not found!")

          p.write_text(s)
          print("JVM compatibility fixed!")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: AmericanLifeEnglish-APK
          path: app/build/outputs/apk/debug/*.apk

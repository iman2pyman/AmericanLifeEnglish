name: Vocabulary Learning Checks

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - "stage1/**"
      - ".github/workflows/learning-checks.yml"

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile app and run unit tests (no APK task)
        working-directory: stage1
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon
